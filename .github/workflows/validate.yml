name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n install.sh tests/install_test.sh
      - name: Verify package
        run: ./install.sh verify
      - name: Test install and uninstall
        run: bash tests/install_test.sh

