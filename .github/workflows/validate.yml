name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n install.sh tests/install_test.sh
      - name: Verify package
        run: ./install.sh verify
      - name: Test install and uninstall
        run: bash tests/install_test.sh
