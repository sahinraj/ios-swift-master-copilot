name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n install.sh docs/install.sh evals/score.sh tests/*.sh
      - name: Verify package
        run: ./install.sh verify
      - name: Test install and uninstall
        run: bash tests/install_test.sh
      - name: Test one-line bootstrap
        run: bash tests/bootstrap_test.sh
      - name: Test eval harness
        run: bash tests/evals_test.sh
